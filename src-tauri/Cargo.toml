[package]
name = "rodela-companion"
version = "0.1.1"
description = "Rodela Autonomous Cute Robot Desktop Companion"
authors = ["Raiyan Rafid <raiyanrafid41@gmail.com>"]
edition = "2021"

[lib]
name = "rodela_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
